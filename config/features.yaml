version: 2

feature_profiles:
  screen_only:
    implementation_status: implemented
    feature_groups:
      - screen_signal
      - technical_qc
    minimum_input: gene_score_or_count_derived_features
  screen_plus_design:
    implementation_status: implemented
    feature_groups:
      - screen_signal
      - technical_qc
      - experimental_design
    minimum_input: study_screen_contrast_sample_metadata
  context_aware:
    implementation_status: planned
    feature_groups:
      - screen_signal
      - technical_qc
      - experimental_design
      - artifact_risk
      - biological_context
      - cross_screen
    minimum_input: screen_plus_design_plus_versioned_external_context
  selection_model:
    implementation_status: baseline_implemented
    feature_groups:
      - screen_signal
      - technical_qc
      - experimental_design
      - author_selection
    endpoint: tested_vs_explicitly_not_tested

feature_groups:
  screen_signal:
    allowed_for_primary_model: true
    features:
      - guide_n
      - median_guide_lfc
      - mean_guide_lfc
      - absolute_median_guide_lfc
      - absolute_mean_guide_lfc
      - is_sensitization_signal
      - is_neutral_signal
      - direction_aligned_median_guide_lfc
      - direction_aligned_mean_guide_lfc
      - direction_signal_agreement
      - guide_lfc_mad
      - guide_lfc_iqr
      - guide_direction_agreement
      - top2_abs_lfc_mean
      - leave_one_guide_out_median_sd
      - strongest_guide_dominance
      - mean_control_count
      - low_count_fraction
      - zero_fraction_control
      - zero_fraction_treatment
      - within_screen_effect_percentile
      - mageck_lfc
      - mageck_fdr
      - drugz_normz
      - orcs_author_score
      - orcs_author_rank
    source_rules:
      orcs: >-
        BioGRID ORCS preserves author-method screen scores and ranked hits. These
        fields may be gene-score evidence for the observed screen, but never an
        orthogonal-validation label.
  technical_qc:
    allowed_for_primary_model: true
    features:
      - median_library_size
      - replicate_correlation
      - control_replicate_correlation
      - treatment_replicate_correlation
      - replicate_effect_sd
      - essential_gene_separation
      - nontargeting_dispersion
      - coverage_per_guide
  experimental_design:
    allowed_for_primary_model: true
    features:
      - library_size_guides
      - target_gene_count
      - guides_per_gene_median
      - nontargeting_guide_count
      - library_moi
      - effector_moi
      - coverage_transduction
      - coverage_selection
      - coverage_harvest
      - minimum_declared_coverage
      - infection_replicate_count
      - observed_infection_replicate_count
      - observed_biological_replicate_count
      - observed_technical_replicate_count
      - observed_timepoint_count
      - independent_infection_replicates_declared
      - paired_replicate_fraction
      - vehicle_control_present
      - baseline_control_present
      - same_infection_split
      - matched_control
      - cnv_amplification_risk_assessed
      - control_sample_n
      - treatment_sample_n
      - baseline_sample_n
      - antibiotic_selection_days
      - editing_maturation_days
      - plasmid_reads_per_guide
      - plasmid_zero_guide_fraction
      - plasmid_skew_ratio
      - screen_reads_per_guide
      - gdna_fraction_amplified
      - pcr_cycle_count
      - exposure_days
      - recovery_days
      - endpoint_timepoint_days
      - treatment_dose_reported
      - design_metadata_completeness
      - screen_scale_genome_wide
      - selection_strategy_positive_selection
      - selection_strategy_negative_selection
      - selection_strategy_bidirectional_selection
      - selection_strategy_competitive_growth
      - selection_strategy_marker_sort
      - control_type_vehicle
      - control_type_untreated
      - control_type_baseline_t0
      - control_type_later_timepoint
      - control_type_matched_nontargeting
      - control_type_unknown
    provenance_level:
      - screen
      - contrast
      - sample
    prohibit:
      - copying_unreported_values_from_a_library_reference_protocol
      - comparing_raw_doses_across_compounds_without_a_common_scale
  artifact_risk:
    allowed_for_primary_model: true
    features:
      - copy_number
      - expression_log2_tpm
      - raw_corrected_effect_delta
      - raw_corrected_rank_delta
      - multi_target_flag
      - common_essential_flag
      - low_expression_flag
      - cnv_correction_available
  cross_screen:
    allowed_for_primary_model: true
    temporal_cutoff_required: true
    outer_fold_recomputation_required: true
    source_family_deduplication_required: true
    features:
      - same_drug_independent_screen_count
      - same_drug_class_independent_screen_count
      - same_direction_recurrence_fraction
  biological_context:
    allowed_for_primary_model: true
    temporal_cutoff_required: true
    features:
      - cell_line_gene_effect
      - baseline_drug_response
      - gene_alteration_match
      - pathway_context_score
  immune_functional_context:
    implementation_status: report_only_implemented
    allowed_for_primary_model: false
    reason: >-
      Current-snapshot ICRAFT and related immune-screen evidence can contain
      held-out, sibling, or post-cutoff screens. It is reported as a separate
      post-ranking context layer until recurrence is recomputed inside every
      outer fold from a frozen, rights-reviewed compendium.
    safeguards:
      - exact_perturbation_modality_strata
      - registered_exact_direction_rules_only
      - category_consequence_compatibility_required
      - source_fdr_threshold_for_directional_support
      - native_effect_sign_preserved
      - native_lfc_sign_matches_declared_direction
      - controlled_raw_effect_sign_semantics
      - registered_numeric_crispra_display_inversion_only
      - versioned_dual_action_group_adjudication
      - source_and_raw_family_deduplication
      - external_study_collapsed_to_one_source_family
      - explicit_temporal_cutoff
      - one_to_one_orthology_for_quantitative_support
      - verified_full_rank_lists_only_for_rra
      - canonical_rank_roster_checksum_recomputed
      - cross_list_context_homogeneity_required
      - candidate_present_in_every_selected_rank_list
      - one_rank_list_per_provenance_component
      - explicit_self_exclusion_or_target_absence_attestation
      - minimum_two_independent_families_for_rra
      - no_validation_labels_or_success_model_features
    report_outputs:
      - report_only_immuno_tumor_favorable_fraction
      - report_only_immuno_immune_favorable_fraction
      - report_only_immuno_dual_action_class
      - report_only_immuno_rra_pvalue
      - report_only_immuno_direction_unresolved_fraction
      - report_only_immuno_directional_support_record_n
      - report_only_immuno_rra_verified_list_n
  translation_context:
    implementation_status: report_only_implemented
    allowed_for_primary_model: false
    reason: >-
      Trial registries describe the treatment/disease landscape, not gene-level
      validation. Curated patient and preclinical claims remain separate
      post-ranking lanes until a frozen, temporally eligible, leakage-audited
      training design is prespecified.
    safeguards:
      - trial_records_forbid_gene_ranking_use
      - broad_api_retrieval_followed_by_local_structured_matching
      - treatment_entity_aliases_separate_from_broader_class_terms
      - cancer_entity_aliases_separate_from_broader_ancestor_terms
      - subtype_entity_aliases_restricted_to_same_subtype
      - declared_role_tagged_query_set_with_no_ontology_recall_claim
      - live_snapshot_must_round_trip_through_frozen_replay_validation
      - report_build_revalidates_snapshot_document_and_nested_studies
      - clinical_trial_nct_ids_unique_within_each_query
      - strict_registry_status_uses_only_registry_resolvable_structured_axes
      - strict_registry_and_exact_curated_context_require_versioned_treatment_and_cancer_ids
      - strict_registry_subtype_requires_parent_cancer_binding
      - component_intervention_mentions_never_support_strict_registry_status
      - requested_regimen_stage_and_line_force_registry_strict_abstention
      - registry_biomarker_mention_never_establishes_typed_exact_match
      - current_trial_snapshots_forbidden_as_historical_features
      - biomarker_term_feature_state_specimen_timepoint_and_observation_all_or_none
      - typed_biomarker_exactness_requires_informative_axes_attestation
      - typed_biomarker_exactness_requires_observed_axis_status
      - disease_subtype_exactness_requires_versioned_parent_binding
      - regimen_exactness_requires_verified_active_exposure_ids_and_provenance
      - controlled_curie_prefix_must_match_declared_versioned_identifier_source
      - placeholder_identity_and_provenance_values_fail_closed
      - scientific_attestations_require_literal_booleans
      - signed_subtype_biomarker_state_and_specimen_preserved_during_matching
      - patient_predictive_claim_requires_quantified_formal_interaction
      - cohort_context_biomarker_is_distinct_from_candidate_gene_predictor
      - predictor_gene_requires_versioned_identity_and_assay_compatibility
      - predictor_identity_attestation_is_not_resolver_authentication
      - patient_interactions_require_controlled_active_exposure_sets_and_relations
      - patient_predictive_claim_requires_distinct_source_assignment_ids
      - patient_interactions_require_versioned_inference_rule_and_estimability
      - supported_null_inconclusive_and_unsupported_interactions_are_separate
      - patient_exact_regimen_requires_verified_treatment_exposure
      - prognostic_predictor_requires_pretreatment_measurement
      - exact_patient_context_requires_ontology_subtype_typed_biomarker_regimen_stage_and_line_match
      - omitted_exact_axes_are_never_wildcards
      - longitudinal_claims_require_paired_baseline
      - gene_specific_preclinical_claim_requires_versioned_curator_attested_gene_identity
      - direct_preclinical_claim_requires_vehicle_and_interaction_controls
      - exact_preclinical_context_requires_matching_perturbed_compartment_and_endpoint_category
      - direction_concordance_requires_exact_context_and_matching_perturbation_modality
      - direct_preclinical_direction_requires_verified_status_numeric_effect_and_sample_n
      - compatible_nonexact_context_separate_from_conflicting_or_incompatible_context
      - mixed_compatible_and_conflicting_evidence_has_explicit_status
      - source_and_raw_family_deduplication
      - explicit_temporal_cutoff
      - target_family_exclusion_or_absence_attestation
      - candidate_order_and_primary_axes_preserved
      - rank_manifest_binding_requires_versioned_complete_bundle_and_rank_semantics
      - rank_manifest_consumer_rechecks_native_numeric_domains_and_completeness
      - frozen_or_injected_clinical_source_cannot_emit_strict_registry_count
      - no_candidate_filtering_or_reranking
      - no_validation_or_reproducibility_probability
      - no_clinical_or_preclinical_mega_score
      - success_model_denies_all_report_only_contract_fields
    report_outputs_inventory: principal_non_exhaustive
    report_outputs:
      - report_only_preclinical_family_n
      - report_only_preclinical_exact_context_family_n
      - report_only_preclinical_compatible_nonexact_context_family_n
      - report_only_preclinical_conflicting_context_family_n
      - report_only_preclinical_direct_interaction_exact_context_family_n
      - report_only_preclinical_in_vivo_exact_context_family_n
      - report_only_preclinical_status
      - report_only_patient_exact_context_family_n
      - report_only_patient_compatible_nonexact_context_family_n
      - report_only_patient_conflicting_context_family_n
      - report_only_patient_predictive_exact_context_family_n
      - report_only_patient_predictive_compatible_nonexact_context_family_n
      - report_only_patient_predictive_conflicting_context_family_n
      - report_only_patient_interaction_null_exact_context_family_n
      - report_only_patient_interaction_null_compatible_nonexact_context_family_n
      - report_only_patient_interaction_null_conflicting_context_family_n
      - report_only_patient_interaction_inconclusive_exact_context_family_n
      - report_only_patient_interaction_inconclusive_compatible_nonexact_context_family_n
      - report_only_patient_interaction_inconclusive_conflicting_context_family_n
      - report_only_patient_interaction_unsupported_exact_context_family_n
      - report_only_patient_interaction_unsupported_compatible_nonexact_context_family_n
      - report_only_patient_interaction_unsupported_conflicting_context_family_n
      - report_only_patient_treated_association_exact_context_family_n
      - report_only_patient_status
  author_selection:
    allowed_for_primary_model: false
    allowed_for_selection_model: true
    features:
      - author_reported_hit_flag
      - author_hit
      - orcs_author_hit_call
      - author_reported_hit_rank
      - author_candidate_zone_flag
      - author_validation_selection_flag
  literature_and_knowledge_graph:
    allowed_for_primary_model: false
    reason: >-
      Initially reported as a separate evidence component to avoid circularity
      and literature-popularity leakage.
    features:
      - publication_count
      - drug_gene_text_score
      - knowledge_graph_proximity
  therapeutic_priority:
    allowed_for_reproducibility_target: false
    reason: Distinct endpoint from experimental reproducibility.
    features:
      - tractability
      - tumor_selectivity
      - normal_tissue_risk
      - druggability
  novelty:
    allowed_for_reproducibility_target: false
    reason: Report separately; novelty is not evidence of validation success.
    features:
      - context_specific_publication_count
      - first_report_year

missingness:
  policy:
    - retain_prespecified_missingness_indicators
    - fit_imputation_within_outer_training_data_only
    - distinguish_reported_zero_from_not_reported
    - route_or_abstain_when_required_profile_inputs_are_unsupported
  coverage_outputs:
    - profile_name
    - metadata_completeness_fraction
    - feature_family_availability
    - outside_training_support_flags
  prohibit:
    - treating_missing_as_zero_without_semantic_justification
    - dropping_all_incomplete_studies_without_sensitivity_analysis
    - silently_using_population_means_for_missing_multiomics

identifier_policy:
  join_or_ood_only:
    - gene_symbol
    - exact_drug_id
    - exact_cell_line_id
    - exact_library_id
    - biogrid_orcs_screen_id

forbidden_success_features:
  - label_code
  - testing_status
  - validation_phenotype_reproduced
  - validation_effect_size
  - rescue_performed
  - causal_reversal_performed
  - author_validation_selection_flag
  - validation_figure_prominence
  - clinical_trial_count
  - patient_molecular_outcome
  - preclinical_support
  - translation_context
