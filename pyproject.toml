[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-evidencerank"
version = "0.2.0.dev0"
description = "Experimental-design-aware prioritization of CRISPR drug-response screen hits for orthogonal validation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Diana Samarkhanova" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scikit-learn>=1.4"
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]

[project.scripts]
crispr-evidencerank = "crispr_evidencerank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
