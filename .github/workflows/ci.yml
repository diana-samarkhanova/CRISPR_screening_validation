name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.29
          uv sync \
            --locked \
            --all-extras \
            --python "${{ matrix.python-version }}"
          uv run python -c 'import os, sys; assert ".".join(map(str, sys.version_info[:2])) == os.environ["UV_PYTHON"]'

      - name: Guard repository contents
        run: uv run python scripts/check_repository.py

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Verify deterministic generated files
        run: |
          uv run python scripts/export_schemas.py
          git diff --exit-code -- schemas
          uv run python scripts/generate_synthetic.py
          git diff --exit-code -- examples/synthetic

      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=crispr_evidencerank
          --cov-report=term-missing
          --cov-fail-under=75

      - name: Run smoke test
        run: uv run python scripts/smoke_test.py

      - name: Build distribution
        run: uv build

      - name: Install wheel in clean environment
        run: |
          uv venv \
            --python "${{ matrix.python-version }}" \
            /tmp/crispr-evidencerank-wheel
          uv pip install \
            --python /tmp/crispr-evidencerank-wheel/bin/python \
            dist/*.whl
          /tmp/crispr-evidencerank-wheel/bin/crispr-evidencerank --help

      - name: Run wheel-installed CLI reports end to end
        run: |
          /tmp/crispr-evidencerank-wheel/bin/crispr-evidencerank \
            prepare-validation-adjudication \
            --completed-review-manifest \
              data/manifests/orcs_2.0.18/curation_batches/batch_001/dual_review_manifest.json \
            --expected-completed-review-manifest-sha256 \
              4482acfaf1b9670d4e7c5e2dfa65cdf98ce6b24a69995ca7ebe34ff0abed2bf8 \
            --expected-comparison-sha256 \
              203da9c7a4f904df61a71940f99c883c1b5c67afac200a2af2686fb685b6660b \
            --packet-id orcs-2.0.18-batch-001-adjudication-ci \
            --prepared-date 2026-08-29 \
            --output-dir /tmp/validation-adjudication-packet
          /tmp/crispr-evidencerank-wheel/bin/crispr-evidencerank rank-screen \
            --mageck-summary examples/synthetic/mageck_gene_summary.tsv \
            --screen-id synthetic_olaparib \
            --contrast-id olaparib_vs_vehicle \
            --positive-tail-means resistance \
            --output-dir /tmp/screen-report
          /tmp/crispr-evidencerank-wheel/bin/crispr-evidencerank rank-screen \
            --counts examples/synthetic/guide_counts_screen_01.csv \
            --samples examples/synthetic/sample_sheet_screen_01.csv \
            --positive-lfc-means resistance \
            --output-dir /tmp/count-screen-report
          /tmp/crispr-evidencerank-wheel/bin/crispr-evidencerank summarize-immuno-context \
            --evidence examples/synthetic/immune_context/evidence.tsv \
            --candidates /tmp/screen-report/ranked_candidates.tsv \
            --cutoff-date 2025-04-08 \
            --target-modality CRISPR_KO \
            --dual-action-group-id ko_antitumor_function \
            --dual-action-group-version synthetic-v1 \
            --output-dir /tmp/immune-context
          /tmp/crispr-evidencerank-wheel/bin/crispr-evidencerank summarize-translation-context \
            --context-id synthetic-treatment-context \
            --screen-id synthetic_olaparib \
            --contrast-id olaparib_vs_vehicle \
            --treatment SYNTHETIC-DRUG \
            --treatment-id SYN:001 \
            --treatment-ontology-name synthetic \
            --treatment-ontology-version v1 \
            --treatment-modality small_molecule \
            --regimen-name "SYNTHETIC-DRUG monotherapy" \
            --regimen-active-exposure-id SYN:001 \
            --regimen-component-relation fixed_all_of \
            --regimen-active-exposures-verified \
            --regimen-active-exposure-identifier-source synthetic \
            --regimen-active-exposure-identifier-version v1 \
            --treatment-entity-alias SYN-001 \
            --cancer-type "synthetic breast cancer" \
            --cancer-id SYN:CANCER001 \
            --disease-subtype "synthetic TNBC" \
            --disease-subtype-id SYN:TNBC001 \
            --disease-subtype-parent-id SYN:CANCER001 \
            --disease-subtype-parent-binding-verified \
            --disease-ontology-name synthetic \
            --disease-ontology-version v1 \
            --screen-perturbation-modality CRISPR_KO \
            --perturbed-compartment tumor_cell \
            --screen-endpoint-category drug_response_viability \
            --context-date 2025-04-08 \
            --evidence-cutoff-date 2025-04-08 \
            --clinicaltrials-json \
              examples/synthetic/translation_context/clinicaltrials_snapshot.json \
            --preclinical-evidence \
              examples/synthetic/translation_context/preclinical_evidence.tsv \
            --patient-evidence \
              examples/synthetic/translation_context/patient_evidence.tsv \
            --candidates /tmp/screen-report/ranked_candidates.tsv \
            --candidate-manifest /tmp/screen-report/run_manifest.json \
            --target-not-in-evidence-catalog \
            --output-dir /tmp/translation-context
          test -s /tmp/screen-report/ranked_candidates.tsv
          test -s /tmp/screen-report/run_manifest.json
          test -s /tmp/count-screen-report/ranked_candidates.tsv
          test -s /tmp/count-screen-report/run_manifest.json
          test -s /tmp/immune-context/immune_context.tsv
          test -s /tmp/immune-context/immune_context_used_evidence.tsv
          test -s /tmp/immune-context/summary.json
          test -s /tmp/translation-context/clinical_trials.tsv
          test -s /tmp/translation-context/candidate_translation_context.tsv
          test -s /tmp/translation-context/summary.json
          /tmp/crispr-evidencerank-wheel/bin/python - <<'PY'
          import csv
          import json
          from pathlib import Path

          output = Path("/tmp/validation-adjudication-packet")
          manifest = json.loads(
              (output / "adjudication_packet_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          with (output / "adjudication_packet.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              packet_rows = list(csv.DictReader(handle, delimiter="\t"))
          assert len(packet_rows) == 20
          assert manifest["record_count"] == 20
          assert manifest["released_label_count"] == 0
          assert manifest["benchmark_ready_count"] == 0
          PY
