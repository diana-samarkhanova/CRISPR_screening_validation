name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked environment
        run: |
          python -m pip install uv==0.11.29
          uv sync \
            --locked \
            --all-extras \
            --python "${{ matrix.python-version }}"
          uv run python -c 'import os, sys; assert ".".join(map(str, sys.version_info[:2])) == os.environ["UV_PYTHON"]'

      - name: Guard repository contents
        run: uv run python scripts/check_repository.py

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Verify deterministic generated files
        run: |
          uv run python scripts/export_schemas.py
          git diff --exit-code -- schemas
          uv run python scripts/generate_synthetic.py
          git diff --exit-code -- examples/synthetic

      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=crispr_evidencerank
          --cov-report=term-missing
          --cov-fail-under=75

      - name: Run smoke test
        run: uv run python scripts/smoke_test.py

      - name: Build distribution
        run: uv build
